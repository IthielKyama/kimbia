spring.application.name=backend-test
spring.profiles.active=test

# In-Memory H2 Database (Runs 100% in RAM, zero external PostgreSQL connection)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Config for tests
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# Tingg dummy test config
tingg.base-url=https://api-approval.tingg.africa
tingg.client-id=test-client
tingg.client-secret=test-secret
tingg.service-code=TINGGTEST
tingg.api-key=test-api-key
tingg.simulate-on-failure=true

# File upload test config
file.upload-dir=target/test-uploads
app.upload.base-url=http://localhost:8081
