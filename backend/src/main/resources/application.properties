spring.application.name=backend

# Server Configuration (Render/Railway sets PORT dynamically)
server.port=${PORT:8081}

# Database Configuration (Neon PostgreSQL in cloud, local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kimbia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changemeinprod!}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings (Optimized for Neon Serverless autosuspend & connection reuse)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JWT Config
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
# Access Token expiration: 15 minutes
jwt.expiration=900000
# Refresh Token expiration: 30 days
jwt.refresh-expiration=2592000000

# Tingg Checkout & Payout Config
tingg.base-url=${TINGG_BASE_URL:https://api-approval.tingg.africa}
tingg.client-id=${TINGG_CLIENT_ID:cellutest}
tingg.client-secret=${TINGG_CLIENT_SECRET:8JpFHlPeFqf5wb4VKCBm5dwW4o2H9wbe}
tingg.service-code=${TINGG_SERVICE_CODE:TINGGTEST}
tingg.api-key=${TINGG_API_KEY:pscPbgj27sEYaPBdxYoHSshEDdt5Pivq}
tingg.simulate-on-failure=${TINGG_SIMULATE_ON_FAILURE:true}

# File Storage Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.upload.base-url=${APP_BASE_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


